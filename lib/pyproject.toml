[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-llm-source"
version = "1.0.0"
description = "Blue data source for generating typed records with a language model"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "blue-data>=1.0.0,<2",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
llm  = ["litellm>=1.102.0,<2", "diskcache>=5.6,<6"]
dev  = ["pytest", "pytest-asyncio", "pytest-cov", "ruff", "pyright", "build", "twine"]
all  = ["litellm>=1.102.0,<2", "diskcache>=5.6,<6"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blue_data_llm_source = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Findings from raising target-version to py312; tracked for a follow-up (#55).
"src/blue_data_llm_source/llm/client.py" = ["UP041"]
"src/blue_data_llm_source/planning/schedules.py" = ["UP047"]
"src/blue_data_llm_source/source.py" = ["UP036"]
"src/blue_data_llm_source/types.py" = ["UP040"]

[tool.pyright]
# Kept at 3.10: 3.12 reports source.py:1914 (a 3.10-only branch); follow-up of #55.
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["../../blue-data/lib/src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ""
pythonpath = ["src", "."]
testpaths = ["tests/unit"]

[tool.coverage.run]
source = ["src"]
