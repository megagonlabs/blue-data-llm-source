[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-llm-cli"
version = "1.0.0"
description = "Command-line interface for the Blue language model data source"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "blue-data==1.0.0",
    "blue-data-llm-source[llm]==1.0.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff", "pyright", "build", "twine"]

[project.scripts]
blue-llmdb = "blue_data_llm_cli.commands:cli"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blue_data_llm_cli = ["profile_spec.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# Check the library and sibling SDK source alongside this component.
extraPaths = ["src", "../../lib/src", "../../../blue-data/lib/src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ""
pythonpath = ["src", "../../lib/src"]
testpaths = ["tests/unit"]

[tool.coverage.run]
source = ["src"]
